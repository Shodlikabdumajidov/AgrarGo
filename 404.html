  .card{width:100%;max-width:640px;text-align:center;padding:36px 28px 32px;border-radius:32px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 80px -30px rgba(0,0,0,.8),0 0 60px -30px rgba(16,185,129,.5)}

  .row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:14px 28px;border-radius:16px;font-weight:800;text-decoration:none;font-size:1rem;transition:transform .2s ease,box-shadow .3s ease,filter .2s ease,border-color .2s ease,color .2s ease}
  a.primary{background:linear-gradient(135deg,#34d399,#10B981);color:#022c22;box-shadow:0 14px 34px -12px rgba(16,185,129,.7)}

  a.ghost{border:1px solid rgba(255,255,255,.18);color:#cbd5e1}
  a.ghost:hover{color:#34d399;border-color:rgba(16,185,129,.6)}
  a:focus-visible{outline:2px solid #34d399;outline-offset:3px}
  .nf-wheel{transform-box:view-box;transform-origin:220px 106px;animation:nf-spin 6s linear infinite}
  .nf-truck{animation:nf-drive 9s ease-in-out infinite alternate}
  .nf-twinkle{animation:nf-pulse 2.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
  @keyframes nf-spin{to{transform:rotate(360deg)}}
  @keyframes nf-drive{from{transform:translateX(-50px)}to{transform:translateX(50px)}}
  @keyframes nf-pulse{0%,100%{opacity:.5}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.nf-wheel,.nf-truck,.nf-twinkle{animation:none}}
</style>
